<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do List</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body>
<main class="app">
<header class="app-header"><p class="eyebrow">PLAN • DO • DONE</p><h1>My To-Do List</h1><p class="subtitle">Small steps make big progress.</p></header>
<form id="task-form" class="task-form"><label class="sr-only" for="task-input">New task</label><input id="task-input" type="text" placeholder="What do you need to do?" maxlength="160" autocomplete="off" required><button type="submit" class="add-button">+ Add task</button></form>
<section class="list-panel" aria-label="Task list">
<div class="list-heading"><h2>Your tasks</h2><span id="task-count" class="task-count">0 tasks left</span></div>
<div class="filters" role="group" aria-label="Filter tasks"><button type="button" class="filter-button active" data-filter="all" aria-pressed="true">All</button><button type="button" class="filter-button" data-filter="active" aria-pressed="false">Active</button><button type="button" class="filter-button" data-filter="completed" aria-pressed="false">Completed</button></div>
<ul id="task-list" class="task-list"></ul><p id="empty-message" class="empty-message">No tasks yet. Add your first task above!</p>
<div class="list-footer"><span id="total-count">0 tasks</span><button id="clear-completed" class="text-button" type="button">Clear completed</button></div>
</section><footer>Saved automatically on this device.</footer>
</main>
</body></html>
